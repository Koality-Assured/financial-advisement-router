<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Financial Advisement Router Banner</title>
  <desc id="bannerDesc">Hero banner for Financial Advisement Router displaying quantitative financial modeling, asset allocation polyhedra, candlestick telemetry, and SEC/FINRA compliance guardrails in bullion gold and emerald profit palette.</desc>
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070D"/>
      <stop offset="45%" stop-color="#09121B"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>

    <!-- Brand Header Gradient -->
    <linearGradient id="brandTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="90%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Bullion Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="goldSheenH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Emerald Profit Gradients -->
    <linearGradient id="emeraldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="30%" stop-color="#34D399"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Border & Accent Line Gradients -->
    <linearGradient id="bottomAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="30%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="frontierCurveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Radial Atmospheric Lighting -->
    <radialGradient id="glowRight" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#047857" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#04070D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLeft" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#04070D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tangencyGlowBanner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="bloomFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="url(#bannerBg)"/>

  <!-- Radial Atmosphere -->
  <rect width="1200" height="360" fill="url(#glowRight)"/>
  <rect width="1200" height="360" fill="url(#glowLeft)"/>

  <!-- Subtle Precision Geometric Grid -->
  <g opacity="0.1" stroke="#34D399" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- =================================================================== -->
  <!-- LEFT PANEL: BRANDING, TITLE, SUBTITLE & ARCHITECTURAL PILLS         -->
  <!-- =================================================================== -->
  <g transform="translate(64, 0)">
    <!-- Overline Badge Pill -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="280" height="26" rx="13" fill="#0A131E" stroke="url(#pillBorder)" stroke-width="1.2"/>
      <circle cx="14" cy="13" r="4" fill="#10B981" filter="url(#subtleGlow)"/>
      <circle cx="14" cy="13" r="2" fill="#D1FAE5"/>
      <text x="26" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#FDE68A" letter-spacing="1.4">KOALITY-ASSURED • DOMAIN ROUTER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#brandTitleGrad)" letter-spacing="-0.5">Financial Advisement Router</text>

    <!-- Subtitle -->
    <text x="0" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15.5" fill="#94A3B8" letter-spacing="0.2">
      Domain AI agent harness for quantitative finance, portfolio risk modeling,
    </text>
    <text x="0" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15.5" fill="#CBD5E1" letter-spacing="0.2">
      and SEC/FINRA-aware advisement tooling on deterministic Decimal ledgers.
    </text>

    <!-- Legal Standard Notice Pill -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="530" height="24" rx="4" fill="#0A1118" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#FBBF24" letter-spacing="0.5">
        NON-DISCRETIONARY RESEARCH PRODUCT • SEC FORM ADV &amp; FINRA 2214 GUARDRAILS
      </text>
    </g>

    <!-- Architectural Feature Tags / Pills -->
    <g transform="translate(0, 248)">
      <!-- Pill 1: Modern Portfolio Theory -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="30" rx="15" fill="#0A131F" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="12" cy="15" r="3" fill="#10B981"/>
        <text x="22" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#E2E8F0">Markowitz MPT &amp; VaR</text>
      </g>

      <!-- Pill 2: Deterministic Decimal -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="160" height="30" rx="15" fill="#0A131F" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="12" cy="15" r="3" fill="#F59E0B"/>
        <text x="22" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#FEF3C7">Decimal.Decimal Fixed</text>
      </g>

      <!-- Pill 3: SEC EDGAR Ingest -->
      <g transform="translate(348, 0)">
        <rect x="0" y="0" width="158" height="30" rx="15" fill="#0A131F" stroke="#34D399" stroke-width="1" stroke-opacity="0.6"/>
        <circle cx="12" cy="15" r="3" fill="#34D399"/>
        <text x="22" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#E2E8F0">SEC EDGAR Companyfacts</text>
      </g>
    </g>

    <!-- Second Row of Feature Tags -->
    <g transform="translate(0, 288)">
      <!-- Pill 4: DCF Valuation -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="140" height="28" rx="14" fill="#0A131F" stroke="#475569" stroke-width="1"/>
        <text x="14" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">DCF &amp; CAPM WACC</text>
      </g>

      <!-- Pill 5: Seeded Monte Carlo -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="162" height="28" rx="14" fill="#0A131F" stroke="#475569" stroke-width="1"/>
        <text x="14" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">Bit-Identical Replay</text>
      </g>

      <!-- Pill 6: Worktree Isolation -->
      <g transform="translate(318, 0)">
        <rect x="0" y="0" width="144" height="28" rx="14" fill="#0A131F" stroke="#475569" stroke-width="1"/>
        <text x="14" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">Worktree Sandboxed</text>
      </g>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- RIGHT PANEL: QUANTITATIVE DASHBOARD & GEOMETRIC PORTFOLIO DOCK      -->
  <!-- =================================================================== -->
  <g transform="translate(680, 28)">
    <!-- Container Terminal Card Frame -->
    <rect x="0" y="0" width="460" height="295" rx="16" fill="#070C15" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Terminal Top Bar -->
    <rect x="0" y="0" width="460" height="34" rx="16" fill="#0D1622"/>
    <rect x="0" y="22" width="460" height="12" fill="#0D1622"/>
    <!-- Terminal Dots -->
    <circle cx="18" cy="17" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="32" cy="17" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="46" cy="17" r="4" fill="#10B981" opacity="0.8"/>
    <!-- Terminal Label -->
    <text x="64" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="600" font-size="10.5" fill="#64748B">
      QUANTITATIVE ENGINE • PORTFOLIO TELEMETRY
    </text>
    <!-- Right Indicator Badge -->
    <rect x="360" y="9" width="85" height="16" rx="8" fill="#064E3B"/>
    <circle cx="370" cy="17" r="2.5" fill="#34D399"/>
    <text x="378" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="700" font-size="8.5" fill="#D1FAE5">LIVE SIM</text>

    <!-- Telemetry Chart Grid (Inside Card) -->
    <g opacity="0.2" stroke="#334155" stroke-width="1">
      <line x1="25" y1="75" x2="435" y2="75"/>
      <line x1="25" y1="125" x2="435" y2="125"/>
      <line x1="25" y1="175" x2="435" y2="175"/>
      <line x1="25" y1="225" x2="435" y2="225"/>
      <line x1="95" y1="50" x2="95" y2="245"/>
      <line x1="175" y1="50" x2="175" y2="245"/>
      <line x1="255" y1="50" x2="255" y2="245"/>
      <line x1="335" y1="50" x2="335" y2="245"/>
      <line x1="415" y1="50" x2="415" y2="245"/>
    </g>

    <!-- Monte Carlo Fan Paths (Background in Chart) -->
    <g opacity="0.4" fill="none" stroke-width="1.2">
      <path d="M 40 215 Q 120 195, 200 150 T 360 85" stroke="#10B981" stroke-dasharray="2 3"/>
      <path d="M 40 215 Q 140 205, 220 165 T 370 115" stroke="#34D399" stroke-dasharray="1 3"/>
      <path d="M 40 215 Q 110 180, 190 120 T 350 65" stroke="#FBBF24" stroke-dasharray="3 4"/>
      <path d="M 40 215 Q 150 220, 240 190 T 380 155" stroke="#64748B" stroke-dasharray="2 4"/>
      <!-- VaR 99% Tail Cutoff Path -->
      <path d="M 40 215 Q 160 235, 250 220 T 390 205" stroke="#EF4444" stroke-dasharray="4 3" stroke-opacity="0.8"/>
    </g>

    <!-- Candlestick Series (Left Half of Chart) -->
    <g transform="translate(10, 0)">
      <!-- Candle 1 -->
      <line x1="45" y1="180" x2="45" y2="230" stroke="#64748B" stroke-width="1.2"/>
      <rect x="41" y="190" width="8" height="24" rx="1.5" fill="#1E293B" stroke="#475569" stroke-width="1"/>

      <!-- Candle 2: Emerald impulse -->
      <line x1="65" y1="165" x2="65" y2="215" stroke="#10B981" stroke-width="1.2"/>
      <rect x="61" y="172" width="8" height="30" rx="1.5" fill="#059669" stroke="#34D399" stroke-width="1"/>

      <!-- Candle 3: Retrace -->
      <line x1="85" y1="170" x2="85" y2="225" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="81" y="185" width="8" height="22" rx="1.5" fill="#78350F" stroke="#FBBF24" stroke-width="1"/>

      <!-- Candle 4: Strong push -->
      <line x1="105" y1="140" x2="105" y2="200" stroke="#10B981" stroke-width="1.2"/>
      <rect x="101" y="148" width="8" height="38" rx="1.5" fill="#10B981" stroke="#6EE7B7" stroke-width="1"/>

      <!-- Candle 5: Consolidate -->
      <line x1="125" y1="135" x2="125" y2="185" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="121" y="142" width="8" height="26" rx="1.5" fill="#B45309" stroke="#FDE68A" stroke-width="1"/>

      <!-- Candle 6: Rally extension -->
      <line x1="145" y1="110" x2="145" y2="170" stroke="#10B981" stroke-width="1.2"/>
      <rect x="141" y="120" width="8" height="36" rx="1.5" fill="#059669" stroke="#34D399" stroke-width="1"/>
    </g>

    <!-- Efficient Frontier Parabola with Optimal Tangency Marker -->
    <path d="M 40 220 Q 80 140, 160 95 T 300 62 T 400 55" fill="none" stroke="url(#frontierCurveGrad)" stroke-width="3" filter="url(#bloomFilter)"/>
    <path d="M 40 220 Q 80 140, 160 95 T 300 62 T 400 55" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>

    <!-- Tangency Portfolio Star Point -->
    <g transform="translate(300, 62)" filter="url(#bloomFilter)">
      <circle cx="0" cy="0" r="16" fill="url(#tangencyGlowBanner)"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    </g>
    <!-- Callout Marker for Tangency -->
    <text x="320" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="700" font-size="9" fill="#FDE68A">
      OPT. SHARPE
    </text>
    <text x="320" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="600" font-size="8" fill="#34D399">
      R_p / σ_p
    </text>

    <!-- ============================================================= -->
    <!-- 3D ASSET ALLOCATION POLYHEDRON (FLOATING ISOMETRIC EMBLEM)     -->
    <!-- ============================================================= -->
    <g transform="translate(295, 155)">
      <!-- Polyhedron Shadow / Glow -->
      <polygon points="0,58 -48,28 -48,-24 0,-54 48,-24 48,28" fill="#000000" opacity="0.6" filter="url(#bloomFilter)"/>

      <!-- Lower Facets -->
      <polygon points="0,0 -44,24 -44,-18 0,-40" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <polygon points="0,0 44,24 44,-18 0,-40" fill="#0F172A" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
      <polygon points="0,0 -44,24 0,54 44,24" fill="url(#goldLinear)" fill-opacity="0.9" stroke="#FDE68A" stroke-width="1.2"/>

      <!-- Top Facets -->
      <polygon points="0,0 -44,-18 0,-54" fill="url(#emeraldLinear)" fill-opacity="0.92" stroke="#6EE7B7" stroke-width="1.2"/>
      <polygon points="0,0 0,-54 44,-18" fill="url(#goldSheenH)" fill-opacity="0.95" stroke="#FFFBEB" stroke-width="1.2"/>

      <!-- Inner Simplex Front Glass Triangle -->
      <polygon points="0,-24 -24,12 24,12" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.75"/>
      <line x1="0" y1="-54" x2="0" y2="-24" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
      <line x1="-44" y1="24" x2="-24" y2="12" stroke="#6EE7B7" stroke-width="1"/>
      <line x1="44" y1="24" x2="24" y2="12" stroke="#FDE047" stroke-width="1"/>
      <line x1="0" y1="54" x2="0" y2="12" stroke="#F59E0B" stroke-width="1.2"/>

      <!-- Vertices -->
      <circle cx="0" cy="-54" r="3" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
      <circle cx="0" cy="54" r="3" fill="#F59E0B" stroke="#FFFBEB" stroke-width="1.5"/>
      <circle cx="-44" cy="-18" r="2.5" fill="#10B981"/>
      <circle cx="44" cy="-18" r="2.5" fill="#FBBF24"/>
      <circle cx="-44" cy="24" r="2.5" fill="#059669"/>
      <circle cx="44" cy="24" r="2.5" fill="#D97706"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" filter="url(#subtleGlow)"/>
    </g>

    <!-- Terminal Footer Status Row -->
    <g transform="translate(16, 252)">
      <rect x="0" y="0" width="428" height="30" rx="6" fill="#0A111A" stroke="#1E293B" stroke-width="1"/>
      <!-- Status Items -->
      <text x="14" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="600" font-size="9" fill="#64748B">LEDGER:</text>
      <text x="56" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="700" font-size="9" fill="#10B981">DECIMAL (EXACT)</text>

      <text x="160" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="600" font-size="9" fill="#64748B">VaR (99%):</text>
      <text x="214" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="700" font-size="9" fill="#FBBF24">0.01200000</text>

      <text x="290" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="600" font-size="9" fill="#64748B">SEC/FINRA:</text>
      <text x="350" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, monospace" font-weight="700" font-size="9" fill="#34D399">GUARDRAILED</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe (Gold & Emerald Gradient Line) -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#bottomAccent)"/>
</svg>
