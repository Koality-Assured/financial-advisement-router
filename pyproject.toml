[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-advisement-router"
version = "0.1.0"
description = "Domain AI agent harness for quantitative finance, portfolio risk modeling, and SEC/FINRA-aware advisement tooling."
authors = [{ name = "Koality-Assured", email = "engineering@koality-assured.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
]

[tool.setuptools]
packages = []
